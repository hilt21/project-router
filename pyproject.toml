[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-router"
version = "0.2.0rc2"
description = "Versioned project playbooks for ChatGPT Work"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
project-router = "router.cli:main"

[tool.setuptools.packages.find]
include = ["router*"]
